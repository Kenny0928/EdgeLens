# 在 Windows／macOS／Linux 上跑自我檢查與測試。
# 注意：repo 推上 GitHub 之前不會執行；在那之前 Windows／Linux 都視為未驗證。
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt 需要的系統函式庫（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 libxcb-randr0 libxcb-render-util0 libdbus-1-3
      # 帶 -c constraints.txt：CI 測的就是學生電腦實際會裝到的版本。
      # 只有 dev 專用工具（pytest、ruff、onnx 等）維持範圍、不釘版本，這樣新版的測試工具壞掉會先在 CI 發現。
      - name: 安裝套件
        run: python -m pip install -r requirements/dev.txt -c requirements/constraints.txt
      - name: 自我檢查
        run: python -m edgelens --selftest
      - name: 程式風格
        run: python -m ruff check edgelens tests
      - name: 測試
        run: python -m pytest -q -m "not hardware and not network"
